name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Install and Build
        env:
          BASE_PATH: /svelte-static-pwa-template
        run: |
          corepack enable
          corepack yarn install --immutable
          corepack yarn lint
          corepack yarn build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: build
          clean: true
          clean-exclude: .nojekyll
          single-commit: true
